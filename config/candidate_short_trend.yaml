# =============================================================================
# CANDIDATE CONFIG — found via IS/OOS backtest search (backtest/search.py)
# =============================================================================
# HONEST HEALTH WARNING (read before trusting this):
#
# This is the ONLY family of configurations that came out positive in BOTH the
# in-sample (first 70%) AND out-of-sample (last 30%) windows of the cached
# history (Dec 2025 -> Jun 2026). BUT the positive result is almost ENTIRELY a
# DIRECTIONAL BET on a falling market, NOT a repeatable edge:
#
#   * Over the test window every asset crashed: BTC -33%, ETH -50%, SOL -55%.
#     Both the IS and OOS sub-windows were down-trends (not independent regimes).
#   * The SAME config run LONG loses badly (OOS PF 0.08); run BOTH-directions it
#     is only marginally positive OOS (PF ~1.24). Short-only "wins" because it
#     was short during the crash — that is BETA, not ALPHA.
#   * A naive "always short" captured MORE of the move (~27% OOS) than this
#     strategy (~7% OOS). The strategy does not beat its own directional beta.
#
# => If the market turns UP, this config will LOSE. Do NOT deploy it as if it
#    had a genuine edge. It is recorded here only as the best the search found,
#    with full disclosure. See the report for the verdict: tuning did not find a
#    real, direction-agnostic, out-of-sample edge.
#
# REALISTIC EXPECTATION (if the down-trend continued, which is NOT guaranteed):
#   ~+0.10% to +0.17%/day on capital in the OOS window  =>  on $5,000 that is
#   roughly $5–$9/day, with a >50% chance of being NEGATIVE if the trend flips.
#   This is NOT $100/day and is NOT a safe positive-expectancy system.
#
# NOTE ON WIRING: two of the levers below are NOT honored by the live bot yet:
#   * strategies.regime_entry_filter  — live has no regime ENTRY gate (it only
#     adapts SL/TP by regime). Would need ~5 lines in main.py analyze loop.
#   * strategies.confidence_threshold — live hardcodes 0.20 at main.py:318.
#   These were applied in the fast simulator (backtest/fast_sim.py). To run this
#   in the real engine/live you must wire them in first.
# =============================================================================

trading:
  instance: "short"
  trade_direction: "short"        # SELL-only (the lever that "worked" = beta)
  symbols:
    - name: "BTC/USDT"
      symbol: "tBTCUST"
      allocation_pct: 40.0
      enabled: true
    - name: "ETH/USDT"
      symbol: "tETHUST"
      allocation_pct: 20.0
      enabled: true
    - name: "SOL/USDT"
      symbol: "tSOLUST"
      allocation_pct: 40.0        # SOL carried most of the robust short result
      enabled: true
  initial_capital: 5000.0
  daily_target: 7.5
  max_risk_per_trade: 0.02
  max_open_positions: 3
  position_size_mode: "dynamic"
  min_position_value_usd: 15.0

strategies:
  enabled: ["trend_following", "grid"]   # ensemble is shadow-only; dropped
  # --- NEW LEVERS (see WIRING note above; honored by backtest/fast_sim.py) ---
  regime_entry_filter: ["TRENDING"]      # only enter in TRENDING regime
  confidence_threshold: 0.30             # higher-conviction entries only
  trend_following:
    enabled: true
    weight: 0.4
    timeframe: "1h"
    ema_fast: 9
    ema_slow: 21
    rsi_period: 14
  grid:
    enabled: true
    weight: 0.25
    timeframe: "15m"

risk:
  leverage: 2.0
  max_daily_loss: 150.0          # 3% of $5,000
  max_drawdown_pct: 10.0
  max_single_pct: 0.20
  stop_loss_pct: 3.0             # wider stop (search preferred 3% over 2%)
  take_profit_pct: 6.0           # let winners run (2:1 reward:risk)
  trailing_stop: false           # search slightly preferred no trailing here
  cooldown_after_loss: 300

# Regime SL/TP adaptation kept ON (use_regime_mult=True in the sim run).
regime_detector:
  enabled: true
  regime_params:
    TRENDING:  {stop_loss_mult: 1.2, take_profit_mult: 1.5, position_size_mult: 1.0}
    RANGING:   {stop_loss_mult: 0.8, take_profit_mult: 0.7, position_size_mult: 0.8}
    VOLATILE:  {stop_loss_mult: 1.5, take_profit_mult: 1.0, position_size_mult: 0.5}

sentiment:
  enabled: false
