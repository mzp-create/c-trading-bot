# Crypto Trading Bot — Configuration
trading:
  symbols:
    - name: "BTC/USDT"
      symbol: "tBTCUST"
      allocation_pct: 50.0  # 50% of capital
      enabled: true
    - name: "ETH/USDT"
      symbol: "tETHUST"
      allocation_pct: 30.0  # 30% of capital
      enabled: true
    - name: "SOL/USDT"
      symbol: "tSOLUST"
      allocation_pct: 20.0  # 20% of capital
      enabled: true
  initial_capital: 526.8  # USDT total across all pairs
  daily_target: 15.0      # ~2.8%/day profit target (was 25 — unrealistic on $526)
  # Fraction of capital RISKED per trade (loss if stop-loss is hit), see
  # risk/manager.calculate_position_size. 2% is the conservative standard;
  # 5% on a tiny account is how this bot lost most of its capital.
  max_risk_per_trade: 0.02  # 2% max risk per trade
  max_open_positions: 6  # 2 per pair max
  position_size_mode: "dynamic"  # fixed, dynamic, kelly
  min_position_value_usd: 50.0  # Minimum $50 per trade (no micro-positions)

exchange:
  name: "bitfinex"        # CCXT bitfinex with automatic nonce handling
  testnet: false  # Set to false for live trading
  rate_limit: 1.0  # seconds between API calls
  ws_reconnect_delay: 5
  ws:
    enabled: true                       # false => pure Phase-2 REST behavior
    wss_host: "wss://api.bitfinex.com/ws/2"
    ticker_staleness_seconds: 15
    order_confirm_timeout_seconds: 10
    reconcile_interval_seconds: 90      # periodic REST reconcile (reconnect recovery)
  default_type: "margin"  # Use margin wallet where your UST/USDT funds are
  # Nonce handling: CCXT manages nonces internally (no more "nonce: small" errors)
  api_key: "${BITFINEX_API_KEY}"  # Set via env var
  api_secret: "${BITFINEX_API_SECRET}"  # Set via env var

strategies:
  enabled: ["ensemble", "trend_following", "grid"]
  
  # Ensemble strategy (ML + RL)
  ensemble:
    enabled: true
    ml_weight: 0.4
    rl_weight: 0.6
    confidence_threshold: 0.15  # Lower for new models
    agreement_required: false
    use_dynamic_sizing: true
    max_position_pct: 0.95
  
  trend_following:
    enabled: true
    weight: 0.4
    timeframe: "1h"
    ema_fast: 9
    ema_slow: 21
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
  scalping:
    enabled: false
    weight: 0.35
    timeframe: "5m"
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bb_period: 20
    bb_std: 2.0
  grid:
    enabled: true
    weight: 0.25
    timeframe: "15m"
    grid_levels: 10
    grid_spread_pct: 0.5

ml:
  enabled: true
  model_type: "xgboost"  # xgboost, lstm, ensemble
  features:
    - "rsi"
    - "macd"
    - "bb_upper"
    - "bb_lower"
    - "ema_9"
    - "ema_21"
    - "volume_sma"
    - "price_change_1h"
    - "price_change_4h"
    - "volatility"
  lookback: 48  # hours of data for training
  retrain_interval: 24  # hours between retrains
  min_train_samples: 100

regime_detector:
  enabled: true
  adx_trending_threshold: 25    # ADX >= 25 → trending
  adx_ranging_threshold: 20     # ADX < 20 → ranging
  volatility_ratio_threshold: 1.5  # > 1.5x hist vol → volatile
  lookback: 50                  # periods to compute vol ratio
  trend_lookback: 14            # periods for ADX
  max_correlation: 0.7          # max pairwise corr for multi-asset
  regime_params:
    TRENDING:
      stop_loss_mult: 1.2       # wider stops
      take_profit_mult: 1.5     # bigger targets
      position_size_mult: 1.0   # full size
    RANGING:
      stop_loss_mult: 0.8       # tighter stops
      take_profit_mult: 0.7     # smaller targets
      position_size_mult: 0.8   # 80% size
    VOLATILE:
      stop_loss_mult: 1.5       # much wider stops
      take_profit_mult: 1.0     # normal targets
      position_size_mult: 0.5   # half size

sentiment:
  enabled: true
  cache_ttl: 300                 # 5 min cache
  source_weights:
    rss: 1.0                     # Always enabled, free
    newsapi: 0.5                 # Needs NEWSAPI_KEY env var
    reddit: 0.5                  # Needs REDDIT_CLIENT_ID + REDDIT_CLIENT_SECRET
  llm_model: ""                  # Set to "deepseek-chat" to enable LLM scoring
  filter_strength: "normal"      # "aggressive" | "normal" | "light"

risk:
  # Leverage = MAX margin multiplier; it raises the position-size CEILING
  # (cap = capital * leverage * max_single_pct) and is the divisor for the
  # margin/liquidation guard. Modest 2x keeps liquidation distance comfortable.
  leverage: 2.0              # 2x margin leverage (was 5x — too aggressive on $526)
  # Daily-loss circuit breaker, proportional to capital (~3% of $526.80 ≈ $16).
  # Must be < max_drawdown_pct in dollar terms so the daily breaker trips first.
  max_daily_loss: 16.0       # Stop trading after ~$16 (~3%) daily loss
  max_drawdown_pct: 10.0     # Max drawdown before stopping (~$53 on $526)
  max_single_pct: 0.20       # Base cap fraction; effective cap = *leverage
  stop_loss_pct: 2.0         # Per position stop loss
  take_profit_pct: 4.0       # Per position take profit
  trailing_stop: true
  trailing_stop_activation: 2.0  # Activate after 2% profit
  trailing_stop_distance: 0.5    # Trailing stop at 0.5% below peak
  cooldown_after_loss: 300       # 5 min cooldown after loss

monitoring:
  log_level: "INFO"
  save_trades: true
  save_equity_curve: true
  telegram_alerts: true
  telegram_bot_token: ""  # Set via env var
  telegram_chat_id: ""    # Set via env var
  alert_on_trade: true
  alert_on_drawdown: true
  daily_summary: true

data:
  ohlcv_dir: "data/ohlcv/"
  models_dir: "data/models/"
  trades_file: "data/trades.csv"
  db_file: "data/trading.db"
  equity_file: "data/equity.csv"
  log_file: "logs/bot.log"
