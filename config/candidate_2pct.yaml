# CANDIDATE config targeting ~2%/MONTH (paper-first) — uses the two levers that
# reduced losses most in backtest: regime entry-filter (trade only in TRENDING)
# + higher confidence threshold (0.30) + wider 3/6 stops, both directions.
#
# HONEST STATUS: in the IS/OOS search this family came out ~+1.3%/month OOS
# (PF ~1.24) — borderline vs the 2%/month goal, on a thin downtrend-only OOS
# window. It is NOT proven. Run PAPER first across a non-crash stretch; only
# consider real capital if forward paper shows sustained ~2%/month.
#   python main.py --mode paper --config config/candidate_2pct.yaml --instance default
#   python main.py --mode backtest --config config/candidate_2pct.yaml   # validate

trading:
  instance: "default"
  trade_direction: "both"
  symbols:
    - {name: "BTC/USDT", symbol: "tBTCUST", allocation_pct: 50.0, enabled: true}
    - {name: "ETH/USDT", symbol: "tETHUST", allocation_pct: 30.0, enabled: true}
    - {name: "SOL/USDT", symbol: "tSOLUST", allocation_pct: 20.0, enabled: true}
  initial_capital: 5000.0
  daily_target: 3.5                # ~2%/month (~$100/mo) — NOT a guarantee
  max_risk_per_trade: 0.015
  max_open_positions: 3
  position_size_mode: "dynamic"
  min_position_value_usd: 25.0

exchange:
  name: "bitfinex"
  testnet: false
  rate_limit: 1.0
  trust_exchange_positions: false
  ws_reconnect_delay: 5
  ws:
    enabled: true
    wss_host: "wss://api.bitfinex.com/ws/2"
    ticker_staleness_seconds: 15
    order_confirm_timeout_seconds: 10
    reconcile_interval_seconds: 90
  default_type: "margin"
  api_key: "${BITFINEX_LONG_API_KEY}"
  api_secret: "${BITFINEX_LONG_API_SECRET}"

strategies:
  confidence_threshold: 0.30       # LEVER: higher conviction (live default 0.20)
  enabled: ["ensemble", "trend_following", "grid"]
  ensemble:
    enabled: true
    shadow: true
    ml_weight: 0.4
    rl_weight: 0.6
    confidence_threshold: 0.15
    agreement_required: false
    use_dynamic_sizing: true
    max_position_pct: 0.95
  trend_following:
    enabled: true
    weight: 0.4
    timeframe: "1h"
    ema_fast: 9
    ema_slow: 21
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
  grid:
    enabled: true
    weight: 0.25
    timeframe: "15m"
    grid_levels: 10
    grid_spread_pct: 0.5

ml:
  enabled: true
  model_type: "xgboost"
  features: ["rsi", "macd", "bb_upper", "bb_lower", "ema_9", "ema_21",
             "volume_sma", "price_change_1h", "price_change_4h", "volatility"]
  lookback: 48
  retrain_interval: 24
  min_train_samples: 200

regime_detector:
  enabled: true
  trade_only_trending: true        # LEVER: only enter in TRENDING regime
  adx_trending_threshold: 25
  adx_ranging_threshold: 20
  volatility_ratio_threshold: 1.5
  lookback: 50
  trend_lookback: 14
  max_correlation: 0.7
  regime_params:
    TRENDING: {stop_loss_mult: 1.0, take_profit_mult: 1.0, position_size_mult: 1.0}
    RANGING:  {stop_loss_mult: 0.8, take_profit_mult: 0.7, position_size_mult: 0.8}
    VOLATILE: {stop_loss_mult: 1.5, take_profit_mult: 1.0, position_size_mult: 0.5}

sentiment:
  enabled: false

backtest:
  trending_only: true              # engine equivalent of trade_only_trending

risk:
  leverage: 2.0
  max_daily_loss: 150.0
  max_drawdown_pct: 8.0
  max_single_pct: 0.20
  stop_loss_pct: 3.0               # LEVER: wider stops (was 2.0)
  take_profit_pct: 6.0             # LEVER: 2:1 R:R at wider stops (was 4.0)
  trailing_stop: true
  trailing_stop_activation: 2.0
  trailing_stop_distance: 0.5
  cooldown_after_loss: 600

monitoring:
  log_level: "INFO"
  save_trades: true
  save_equity_curve: true
  telegram_alerts: true
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  alert_on_trade: true
  alert_on_drawdown: true
  daily_summary: true
  instance_prefix: "🎯 CAND"

data:
  ohlcv_dir: "instances/cand2pct/data/ohlcv/"
  models_dir: "instances/cand2pct/data/models/"
  trades_file: "instances/cand2pct/data/trades.csv"
  db_file: "instances/cand2pct/data/trading.db"
  equity_file: "instances/cand2pct/data/equity.csv"
  log_file: "instances/cand2pct/logs/bot.log"
