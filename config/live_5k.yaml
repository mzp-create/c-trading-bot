# SINGLE-INSTANCE LIVE config for a ~$5,000 account (trades both directions).
# Single instance (not dual) so position accounting + max_open_positions are
# clean (one process, one key, account-wide position count is correct).
#   python3 main.py --mode live --instance default --config config/live_5k.yaml
#
# IMPORTANT — read before going live:
#   * REALISTIC TARGET (revised 2026-06-07): the original "$100/day = 2%/day" is
#     NOT attainable with this strategy. A 4.4-month backtest shows NEGATIVE edge
#     (-28% return, profit factor 0.59, ~-0.2%/day). DO NOT deploy real capital
#     until the strategy demonstrates *positive expectancy* in forward paper
#     trading. Near-term goal = break-even/small-positive in paper, not $100/day.
#   * Run paper first:  python main.py --mode paper --config config/live_5k.yaml
#   * This config sizes positions and caps risk for $5k; it does NOT create edge.
#   * Ensemble/RL stays in SHADOW (unproven model must not trade).

trading:
  instance: "default"
  trade_direction: "both"          # allow BUY (long) and SELL (short)

  symbols:
    - name: "BTC/USDT"
      symbol: "tBTCUST"
      allocation_pct: 50.0
      enabled: true
    - name: "ETH/USDT"
      symbol: "tETHUST"
      allocation_pct: 30.0
      enabled: true
    - name: "SOL/USDT"
      symbol: "tSOLUST"
      allocation_pct: 20.0
      enabled: true

  initial_capital: 5000.0
  daily_target: 25.0               # realistic stretch (~0.5%/day) IF edge is
  # proven in paper first. Original $100/day (2%/day) is not attainable — see header.
  max_risk_per_trade: 0.015        # 1.5% of capital risked per trade (~$75 max loss)
  max_open_positions: 3            # now actually enforced
  position_size_mode: "dynamic"
  min_position_value_usd: 25.0

exchange:
  name: "bitfinex"
  testnet: false
  rate_limit: 1.0
  trust_exchange_positions: false
  ws_reconnect_delay: 5
  ws:
    enabled: true
    wss_host: "wss://api.bitfinex.com/ws/2"
    ticker_staleness_seconds: 15
    order_confirm_timeout_seconds: 10
    reconcile_interval_seconds: 90
  default_type: "margin"
  # Single instance: the shared/long key is safe (sole process on the account).
  api_key: "${BITFINEX_LONG_API_KEY}"
  api_secret: "${BITFINEX_LONG_API_SECRET}"

strategies:
  enabled: ["ensemble", "trend_following", "grid"]
  ensemble:
    enabled: true
    shadow: true                   # observed only — unproven model must not trade
    ml_weight: 0.4
    rl_weight: 0.6
    confidence_threshold: 0.15
    agreement_required: false
    use_dynamic_sizing: true
    max_position_pct: 0.95
  trend_following:
    enabled: true
    weight: 0.4
    timeframe: "1h"
    ema_fast: 9
    ema_slow: 21
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
  grid:
    enabled: true
    weight: 0.25
    timeframe: "15m"
    grid_levels: 10
    grid_spread_pct: 0.5

ml:
  enabled: true
  model_type: "xgboost"
  features: ["rsi", "macd", "bb_upper", "bb_lower", "ema_9", "ema_21",
             "volume_sma", "price_change_1h", "price_change_4h", "volatility"]
  lookback: 48
  retrain_interval: 24
  min_train_samples: 200           # >= train() floor; fetch is max(600, this)

regime_detector:
  enabled: true
  adx_trending_threshold: 25
  adx_ranging_threshold: 20
  volatility_ratio_threshold: 1.5
  lookback: 50
  trend_lookback: 14
  max_correlation: 0.7
  regime_params:
    TRENDING: {stop_loss_mult: 1.2, take_profit_mult: 1.5, position_size_mult: 1.0}
    RANGING:  {stop_loss_mult: 0.8, take_profit_mult: 0.7, position_size_mult: 0.8}
    VOLATILE: {stop_loss_mult: 1.5, take_profit_mult: 1.0, position_size_mult: 0.5}

sentiment:
  enabled: false

risk:
  leverage: 2.0                    # modest 2x margin cap
  max_daily_loss: 150.0            # ~3% of $5k — force-flattens + pauses on breach
  max_drawdown_pct: 8.0            # ~$400
  max_single_pct: 0.20             # cap = 5000 * 0.20 * 2 = $2000 max notional/position
  stop_loss_pct: 2.0
  take_profit_pct: 4.0             # 2:1 reward:risk
  trailing_stop: true
  trailing_stop_activation: 1.5
  trailing_stop_distance: 0.5
  cooldown_after_loss: 600         # 10 min cooldown after a loss

monitoring:
  log_level: "INFO"
  save_trades: true
  save_equity_curve: true
  telegram_alerts: true
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  alert_on_trade: true
  alert_on_drawdown: true
  daily_summary: true
  instance_prefix: "💵 5K"

data:
  ohlcv_dir: "instances/live5k/data/ohlcv/"
  models_dir: "instances/live5k/data/models/"
  trades_file: "instances/live5k/data/trades.csv"
  db_file: "instances/live5k/data/trading.db"
  equity_file: "instances/live5k/data/equity.csv"
  log_file: "instances/live5k/logs/bot.log"
